name: Fetch photo candidates
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests pillow
      - run: python tools/fetch_candidates.py
      - name: Commit candidates
        run: |
          git config user.name "photo-bot"; git config user.email "photo-bot@users.noreply.github.com"
          git add candidates sheets
          git commit -m "Add photo candidates" || echo "nothing"
          git push
